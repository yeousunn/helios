[package]
name = "kernel"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
spin = { version = "0.9", default-features = false, features = ["spin_mutex"] }
ipc = { path = "../ipc" }
caps = { path = "../caps" }

[dev-dependencies]
criterion = "0.5"
helios-abi = { path = "../spec/abi" }

[[bench]]
name = "ipc_bench"
harness = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
