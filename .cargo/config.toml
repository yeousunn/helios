# Workspace test configuration.
#
# Kernel tests share global singleton state (proc registry, scheduler, AS
# registry, frame allocator, endpoint/notification/reply tables) and each test
# resets it in its setup. Running tests in parallel makes them clobber each
# other (nondeterministic failures). The whole suite passes deterministically
# single-threaded; force that here so `cargo test` (AGENTS.md gate + CI) is
# reliable everywhere. Override locally with RUST_TEST_THREADS=<n> in the
# environment (force is false).
[env]
RUST_TEST_THREADS = "1"
RUST_MIN_STACK = "16777216"
# Pipeline convenience (path-resolution is workspace-relative in the build
# scripts; missing files just mean "not embedded"):
#   - kernel-boot embeds `init` as the first userspace process (M2)
#   - `init` embeds `ps` as the process server to spawn (M3)
# Real environment variables still take precedence (force is false).
#   - `ps` embeds `child` as the v0 SPAWN payload (Phase 2)
#   - `init` also embeds `vfs` as the second system server (Phase 2)
INIT_IMAGE = "target/x86_64-unknown-none/release/init"
PS_IMAGE = "target/x86_64-unknown-none/release/ps"
CHILD_IMAGE = "target/x86_64-unknown-none/release/child"
VFS_IMAGE = "target/x86_64-unknown-none/release/vfs"
POSIX_IMAGE = "target/x86_64-unknown-none/release/posix"
CONSOLE_IMAGE = "target/x86_64-unknown-none/release/console"
SH_IMAGE = "target/x86_64-unknown-none/release/sh"
CAT_IMAGE = "target/x86_64-unknown-none/release/cat"

# Bare-metal userspace binaries (init, ps) must be fixed-address ET_EXEC
# images: the SDK ELF loader and the kernel boot path reject PIE (ET_DYN).
[target.x86_64-unknown-none]
# - static relocation: fixed-address ET_EXEC images (SDK loader + boot staging
#   reject PIE).
# - image base 2016 MiB: above the boot map's 1 GiB PD coverage (fresh table
#   chain for every user mapping — splitting shared boot huge pages proved
#   fragile), below 2 GiB so the small code model's 32-bit relocations work.
rustflags = [
    "-C", "relocation-model=static",
    "-C", "link-arg=--image-base=0x7E000000",
]
