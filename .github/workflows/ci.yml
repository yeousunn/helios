name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Provision bare-metal target
        run: rustup target add x86_64-unknown-none

      - name: Install QEMU (for boot smoke test)
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86

      - name: rustfmt check
        run: cargo fmt --check

      - name: Host clippy (all kernel/host crates)
        run: cargo clippy --workspace --exclude kernel-boot -- -D warnings

      - name: Host unit tests
        run: cargo test --workspace --exclude kernel-boot

      - name: Userspace clippy (best-effort until E4 lands)
        run: |
          cargo clippy -p sdk -p process -p vfs -p console -p auth -p personality \
            --features user --target x86_64-unknown-none --release -- -D warnings || true

      - name: Full-system QEMU bring-up test (E2)
        run: ./tools/qemu-test.sh
